name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rma_test
      ACCESS_TOKEN_SECRET: test-access-secret
      REFRESH_TOKEN_SECRET: test-refresh-secret
      ACCESS_TOKEN_EXPIRY: 15m
      REFRESH_TOKEN_EXPIRY: 7d
      CORS_ORIGIN: http://localhost:5173
      NODE_ENV: test
      RUN_DB_INTEGRATION_TESTS: "true"
      RUN_HTTP_INTEGRATION_TESTS: "true"
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/rma_test
      UPLOAD_STORAGE_PROVIDER: local
      LOCAL_PRIVATE_UPLOAD_ROOT: /tmp/rma-ci-private-uploads
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Start PostgreSQL
        run: |
          sudo systemctl start postgresql.service
          sudo -u postgres psql --set ON_ERROR_STOP=1 --command "ALTER USER postgres PASSWORD 'postgres';"
          sudo -u postgres createdb rma_test
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run db:migrate:deploy
      - run: npm run verify
      - run: npm run test:coverage
      - run: npm audit --omit=dev --audit-level=high
